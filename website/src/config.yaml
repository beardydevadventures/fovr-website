site:
  name: FoVR Interactive
  site: 'https://www.fovrinteractive.net/'
  base: '/'
  trailingSlash: false

  googleSiteVerificationId: orcPxI47GSa-cRvY11tUe6iGg2IO_RPvnA1q95iEM3M

# Default SEO metadata
metadata:
  title:
    default: FoVR Interactive | Australian XR Development Studio
    template: '%s — FoVR Interactive'
  description: "FoVR Interactive is an Australian XR development studio based in Brisbane, creating VR training, mixed reality applications, interactive simulations and immersive products."
  robots:
    index: true
    follow: true
  openGraph:
    site_name: FoVR Interactive
    images:
      - url: '@/assets/images/default.jpg'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@FovrInteractive'
    site: '@FovrInteractive'
    cardType: summary_large_image

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Blog category path
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Blog tag path
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: G-98P7QGPW01

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
